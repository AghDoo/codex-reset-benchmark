name: Collect forecasts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

concurrency:
  group: codex-reset-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests before collection
        run: python -m unittest discover -s tests -v
      - name: Collect public forecasts
        run: python scripts/collect.py
      - name: Validate archive
        run: python scripts/check_data.py
      - name: Build derived leaderboard data
        run: python scripts/build_site_data.py
      - name: Commit archive and derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/generated
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): [ChatGPT] 更新預測快照與排行榜"
          git push origin "HEAD:${GITHUB_REF_NAME}"
