[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-reset-benchmark"
version = "0.1.0"
description = "Independent benchmark for tracking and comparing Codex reset prediction accuracy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Doo" }]
dependencies = []

[project.urls]
Repository = "https://github.com/AghDoo/codex-reset-benchmark"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
